project:
  type: website
  output-dir: docs
  resources:
    - mri/brain-atlas-viewer/viewer/dist/viewer.html
    - images/card-placeholder.svg

website:
  title: "Visual Neuroscience Lab"
  site-url: https://visualneuroscience.github.io
  favicon: images/favicon.svg
  repo-url: https://github.com/visualneuroscience/visualneuroscience.github.io
  repo-branch: main
  repo-actions: [edit, issue]
  back-to-top-navigation: true
  page-navigation: true
  reader-mode: true
  open-graph: true
  search:
    location: navbar
    type: overlay

  # Top navigation
  navbar:
    logo:
      light:
        path: images/lab-icon.svg
        alt: "Visual Neuroscience Lab logo"
      dark:
        path: images/lab-icon-dark.svg
        alt: "Visual Neuroscience Lab logo"
    left:
      - href: people/index.qmd
        text: People
      - href: mri/index.qmd
        text: MRI
      - href: behavioral/index.qmd
        text: Behavioral
      - href: resources/index.qmd
        text: Resources
      - href: internship/index.qmd
        text: Internships
    right:
      - href: archive/index.qmd
        text: Archive

  # One sidebar per section. To add a page, list it in the matching sidebar
  sidebar:
    - id: people
      title: "People"
      style: docked
      collapse-level: 1
      contents:
        - text: "Overview"
          href: people/index.qmd
        - section: "Joining & leaving"
          contents:
            - people/onboarding/joining-the-lab.qmd
            - people/leaving/leaving-the-lab.qmd
            - people/leaving/leaving-form.qmd
        - section: "Lab life"
          contents:
            - people/lab-meeting/lab-meeting.qmd
            - people/coffee/coffee.qmd
        - section: "Writing & presenting"
          contents:
            - people/writing/writing.qmd
            - people/writing/free-fonts.qmd
            - people/talks/giving-scientific-talks.qmd
            - people/authorship-calculator/authorship-calculator.qmd
        - section: "Funding"
          contents:
            - people/funding/research-funding.qmd
            - people/stipends/stipends-and-prizes.qmd

    - id: mri
      title: "MRI"
      contents:
        - text: "Overview"
          href: mri/index.qmd
        - section: "Running MRI studies"
          contents:
            - mri/mri-studies-general/mri-studies-general.qmd
            - mri/mri-lab-setup/mri-lab-setup.qmd
        - section: "DICOM to GLM pipeline"
          contents:
            - mri/dicom-to-glm/00-overview.qmd
            - mri/dicom-to-glm/01-dicom-to-bids.qmd
            - mri/dicom-to-glm/02-check-intendedfor-field.qmd
            - mri/dicom-to-glm/03-t1w-for-participants.qmd
            - mri/dicom-to-glm/04-defacing.qmd
            - mri/dicom-to-glm/05-remove-noise-scan.qmd
            - mri/dicom-to-glm/06-fmriprep.qmd
            - mri/dicom-to-glm/07-retinotopic-mapping.qmd
            - mri/dicom-to-glm/08-first-level-glm.qmd
            - mri/dicom-to-glm/09-roi-analysis.qmd
            - mri/dicom-to-glm/troubleshooting.qmd
        - section: "Tools"
          contents:
            - mri/7t-anatomical/7t-anatomical-analysis.qmd
            - mri/fmriprep/fmriprep-analysis.qmd
            - mri/bids-and-osf/bids-and-osf.qmd
            - mri/mni-space/mni-space.qmd
            - mri/control-masks/control-masks.qmd
            - mri/oriented-bounding-box/oriented-bounding-box.qmd
            - mri/physiology/physiological-noise-correction.qmd
            - mri/brain-atlas-viewer/brain-atlas-viewer.qmd
            - mri/3d-printing/3d-printing-a-brain.qmd

    - id: behavioral
      title: "Behavioral"
      contents:
        - text: "Overview"
          href: behavioral/index.qmd
        - behavioral/vision-tests/vision-tests.qmd
        - behavioral/bids-behavioral/bids-for-behavioral-studies.qmd

    - id: resources
      title: "Resources"
      contents:
        - text: "Overview"
          href: resources/index.qmd
        - section: "Computing"
          contents:
            - resources/neurodesktop/neurodesktop.qmd
        - section: "Methods"
          contents:
            - resources/power-analysis/power-analysis.qmd
            - resources/participant-compensation/participant-compensation.qmd
        - section: "Equipment"
          contents:
            - resources/gamma-correction/gamma-correction.qmd
            - resources/chinrests/chinrests.qmd
        - section: "This website"
          contents:
            - resources/contributing/contributing.qmd

    - id: internship
      title: "Internships"
      contents:
        - text: "Overview"
          href: internship/index.qmd
        - internship/internship-checklist/internship-checklist.qmd
        - internship/pflichtpraktikum/pflichtpraktikum.qmd
        - internship/project-list/project-list.qmd

    - id: archive
      title: "Archive"
      contents:
        - text: "Overview"
          href: archive/index.qmd
        - archive/dicom-to-bids/dicom-to-bids.qmd
        - archive/freesurfer-fsfast/freesurfer-fsfast.qmd
        - archive/mri-lab-setup-2023/mri-lab-setup-2023.qmd
        - archive/server-access/server-access.qmd

  #DO NOT EDIT BELOW THIS LINE
  page-footer:
    left: "Visual Neuroscience Lab · University of Graz"
    right:
      - icon: github
        href: https://github.com/visualneuroscience
        aria-label: GitHub
      - icon: globe
        href: https://neurovision.uni-graz.at
        aria-label: Lab website at the University of Graz
      - icon: calendar-event
        href: https://calendar.online/cadcb4379c842ce87f53
        aria-label: Lab calendar
format:
  html:
    theme:
      light: theme/theme.scss
      dark: [theme/theme.scss, theme/theme-dark.scss]
    respect-user-color-scheme: true
    fontsize: 12pt
    toc: true
    toc-title: "On this page"
    toc-depth: 3
    title-block-banner: true
    date-format: "D MMM YYYY"
    date-modified: last-modified
    citation-location: margin
    code-copy: true
    code-overflow: wrap
    highlight-style: a11y
    include-after-body: theme/code-download.html
    smooth-scroll: true
    lightbox: auto
    grid:
      sidebar-width: 270px
      body-width: 880px
      margin-width: 250px

editor: visual
