name: Quarto Publish

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check spelling
        uses: crate-ci/typos@v1.50.2

      - name: Check markdown
        if: ${{ !cancelled() }}
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: |
            **/*.qmd
            **/*.md

      - name: Check pages are listed and have a complete header
        if: ${{ !cancelled() }}
        run: bash .github/scripts/check-pages.sh

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # changes made before the cutoff are ignored.
      - name: Restore page dates from git history
        env:
          CUTOFF: "2026-10-01T00:00:00Z"
        run: |
          git ls-files -z '*.qmd' | while IFS= read -r -d '' f; do
            d=$(git log -1 --since="$CUTOFF" --format=%cI -- "$f")
            [ -z "$d" ] && d=$(awk '/^---$/ {n++; next} n == 1 && sub(/^date: */, "") {print; exit}' "$f")
            [ -z "$d" ] && d=$(git log -1 --format=%cI -- "$f")
            touch -d "$d" "$f"
          done

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2.2.0
        with:
          tinytex: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::jsonlite
            any::pwr
            any::WebPower
            any::Superpower

      # built viewer is cached and only rebuilt when its sources change.
      - name: Restore Brain Atlas Viewer
        id: viewer-cache
        uses: actions/cache@v6.1.0
        with:
          path: mri/brain-atlas-viewer/viewer/dist/viewer.html
          key: brain-atlas-viewer-${{ hashFiles('mri/brain-atlas-viewer/viewer/**', '!mri/brain-atlas-viewer/viewer/README.md') }}

      - name: Set up Python
        if: steps.viewer-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Build Brain Atlas Viewer
        if: steps.viewer-cache.outputs.cache-hit != 'true'
        run: |
          pip install -r mri/brain-atlas-viewer/viewer/requirements.txt
          python3 mri/brain-atlas-viewer/viewer/build.py

      - name: Render Quarto project
        uses: quarto-dev/quarto-actions/render@v2.2.0

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/

      - name: Upload PR preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: quarto-preview-pr-${{ github.event.pull_request.number }}
          path: docs/
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
